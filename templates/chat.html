<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<!-- TOP BAR MOBILE -->
<nav class="navbar navbar-dark bg-dark d-md-none px-3">
    <button class="btn btn-outline-light" data-bs-toggle="offcanvas" data-bs-target="#sidebar">
        <i class="fa-solid fa-bars"></i>
    </button>
    <span class="navbar-brand ms-2">Chat</span>
</nav>

<div class="container-fluid p-0">
    <div class="row g-0 app">

        <!-- SIDEBAR DESKTOP -->
        <aside class="col-md-4 col-lg-3 d-none d-md-flex sidebar flex-column">

            <div class="sidebar-header">
                <h4>Mensagens</h4>
            </div>

            <div class="search-box">
                <input id="nomeContato" type="text" placeholder="Buscar usuário...">
                <button onclick="adicionarContato()">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <ul id="lista-contatos"></ul>
        </aside>

        <!-- CHAT -->
        <main class="col-12 col-md-8 col-lg-9 chat">

            <div class="chat-header">
                <div class="header-info">
                    <div class="avatar-large">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div>
                        <h5 id="nome-contato">Selecione um contato</h5>
                        <small>Online</small>
                    </div>
                </div>
            </div>

            <div id="mensagens">
                <div class="placeholder">
                    <i class="fa-solid fa-comments"></i>
                    <p>Selecione uma conversa</p>
                </div>
            </div>

            <div class="enviar">
                <input id="texto" type="text" placeholder="Digite sua mensagem...">
                <button onclick="enviar()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

        </main>

    </div>
</div>

<!-- OFFCANVAS MOBILE -->
<div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="sidebar">

    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Mensagens</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="p-3 d-flex gap-2">
        <input id="nomeContato" type="text" class="form-control" placeholder="Buscar usuário...">
        <button class="btn btn-primary" onclick="adicionarContato()">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <ul id="lista-contatos" class="p-2"></ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/script.js"></script>

</body>
</html>
