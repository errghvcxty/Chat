<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat da Resenha</title>

<link rel="stylesheet" href="static/login.css">

</head>
<body>

<div class="login-container">

    <h2>Chat da Resenha</h2>

    <input
        id="username"
        type="text"
        placeholder="Usuário"
    >

    <input
        id="password"
        type="password"
        placeholder="Senha"
    >

    <button onclick="login()">
        Entrar
    </button>

    <button onclick="register()">
        Criar Conta
    </button>

</div>

<script>

const API_URL =
"https://apichat-production-e8b7.up.railway.app";

async function login(){

    const username =
    document.getElementById("username").value.trim();

    const password =
    document.getElementById("password").value.trim();

    if(!username || !password){
        alert("Preencha todos os campos");
        return;
    }

    try{

        const resposta = await fetch(
            `${API_URL}/login`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    username,
                    password
                })
            }
        );

        const usuario =
        await resposta.json();

        if(!resposta.ok){
            alert(usuario.error);
            return;
        }

        localStorage.setItem(
            "usuario_id",
            usuario.id
        );

        localStorage.setItem(
            "username",
            usuario.username
        );

        window.location.href =
        "templates/chat.html";

    }catch(erro){

        console.error(erro);

        alert(
            "Erro ao conectar com a API"
        );
    }
}

async function register(){

    const username =
    document.getElementById("username").value.trim();

    const password =
    document.getElementById("password").value.trim();

    if(!username || !password){
        alert("Preencha todos os campos");
        return;
    }

    try{

        const resposta = await fetch(
            `${API_URL}/register`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    username,
                    password
                })
            }
        );

        const dados =
        await resposta.json();

        if(!resposta.ok){
            alert(dados.error);
            return;
        }

        alert(
            "Conta criada com sucesso!"
        );

    }catch(erro){

        console.error(erro);

        alert(
            "Erro ao conectar com a API"
        );
    }
}

</script>

</body>
</html>
